name: Sync Upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up git
        run: |
          git config user.name "y50008"
          git config user.email "y50008@users.noreply.github.com"
      - name: Fetch upstream
        run: git remote add upstream https://github.com/morluto/rea.git && git fetch upstream
      - name: Merge upstream main
        run: |
          git checkout main
          git merge --ff-only upstream/main || echo "::warning::Fast-forward failed, manual sync needed"
      - name: Push
        run: git push origin main